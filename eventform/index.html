<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Form</title>
    <meta name="author" content="Cordell Winward">
    <link href="eventform.css" rel="stylesheet">
    <script src="eventform.js" defer></script>
</head>
<body>
    <main class="form-box">
        <h1>Event Ticket</H1>
        <form>
            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" maxlength="50" required>
            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" maxlength="50" required>
            <label id=email-label for="email">Email</label>
            <input id="email" name="email" type="email" maxlength="100" required>
            <label for="type">Type</label>
            <select id="type" name="type" required>
                <option value="">Choose One</option>
                <option value="student">Student</option>
                <option value="guest">Guest</option>
            </select>
            <label for="eventDate">Event Date</label>
            <input id="eventDate" name="eventDate" type="date" required>
            <label id="studentId-label" class="possibly-needed" for="studentId">Student I#</label>
            <input id="studentId" class="possibly-needed" name="studentId" type="text" pattern="[0-9]{9}" maxlength="9">
            <label id="accessCode-label" class="possibly-needed" for="accessCode">Access Code</label>
            <input id="accessCode" class="possibly-needed" name="accessCode" type="text" maxlength="50">
            <button id="submitButton" type="submit">Create Ticket</button>
        </form>
        <div id="event-receipt">

        </div>
    </main>
</body>
</html>
