<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Cordell Winward">
    <meta name="description" content="A character card for Snortleblat">
    <title>Snortleblat Character Card</title>

    <!-- Social Media Meta Tags -->
    <!-- Open Graph (Facebook, ect) -->
     <meta property="og:type" content="website">
     <meta property="og:title" content="Snortleblat Character Card">
     <meta property="og:description" content="A character card for Snortleblat">
     <!-- <meta property="og:url" content="" -->

    <link href="charactercard.css" rel="stylesheet">
    <script src="charactercard.js" defer></script>    
</head>
<body>
    <div id="card">
        <img src="snortleblat.webp" class="card-img" alt="Snortleblat monster in swamp">
        <div class="name">
            <h1>Snortleblat</h1>
        </div>
        <main>
            <div class="stats">
                <p id="class"><b>Class: </b>Swamp Beast Diplomat</p>
                <p id="level"><b>Level: </b>8</p>
                <p id="health"><b>Health: </b>100</p>
            </div>
            <div class="buttons">
                <button id="attack">Attacked</button>
                <button id="levelUp">Level Up</button>
            </div>
        </main>
    </div>
</body>
</html>
